name: Stock prices

on:
  schedule:
    # Live prices every 30 min while the US market is open (13:07-21:37 UTC covers summer and winter time)
    - cron: "7,37 13-21 * * 1-5"
    # Full daily history once Tiingo has the day's close (23:37 UTC, ~07:37 MYT), plus a catch-up run
    - cron: "37 23 * * 1-5"
    - cron: "17 9 * * 2-6"
  push:
    branches: [main]
    paths: [stocks.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/fetch_prices.py ${{ github.event.schedule == '7,37 13-21 * * 1-5' && '--live' || '' }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update stock prices"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
