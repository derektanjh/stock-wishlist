name: Tiingo browser check (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight (what a browser asks first)
        run: |
          curl -sS -i -X OPTIONS "https://api.tiingo.com/iex/?tickers=nvda" \
            -H "Origin: https://derektanjh.github.io" -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization,content-type" | grep -i -E "^HTTP|^access-control" || true
      - name: Live IEX price, as a browser would request it
        env:
          K: ${{ secrets.TIINGO_API_KEY }}
        run: |
          curl -sS -D headers.txt -o body.json "https://api.tiingo.com/iex/?tickers=nvda,aapl&token=$K" -H "Origin: https://derektanjh.github.io"
          grep -i -E "^HTTP|^access-control" headers.txt || true
          python3 -c "import json;d=json.load(open('body.json'));print([{k:x.get(k) for k in ('ticker','tngoLast','last','timestamp','prevClose')} for x in d] if isinstance(d,list) else d)"
